[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-platform"
version = "0.1.0"
description = "Tabular AutoML platform built from scratch: candidate search, leaderboard, promotion gates, registry."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
