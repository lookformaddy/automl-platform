# CI definition. NOTE: this file lives in docs/ by design — activate it by
# moving it to .github/workflows/ci.yml. The GitHub App used for pushes
# lacks the Workflows permission, so it cannot create .github/workflows/
# directly.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python demo.py
